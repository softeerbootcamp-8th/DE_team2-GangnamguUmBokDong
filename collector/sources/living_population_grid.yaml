source_id: living_population_grid
description: "\uC11C\uC6B8 \uC0DD\uD65C\uC778\uAD6C(250m)"
adapter: seoul_openapi
adapter_params: {service: Se250MSpopLocalResd, page_size: 1000, root_key: Se250MSpopLocalResd.row}
schedule: {interval: 1d}
storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]
quality: {max_drop_ratio: 0.05, max_missing_ratio: 0.1, allow_empty: false}
backfill: {enabled: true, max_age: 7d}
policies: {required_missing: drop_row, required_outlier: drop_row, optional_missing: keep_null,
  optional_outlier: set_null}
columns:
  YMD:
    types: [str]
    required: true
  TT:
    types: [str]
    required: true
  H_DNG_CD:
    types: [str]
    required: true
  CELL_ID:
    types: [str]
    required: true
  # 이 소스는 소수 인구를 '*'로 가려서 보낸다(실측: SPOP 9.8%, 나이·성별 컬럼 53.4%).
  # masked_float 캐스터가 '*'을 TYPE_ERROR가 아니라 결측으로 판정시킨다 — 그래야
  # manifest 집계가 missing으로 잡히고 optional_missing 정책이 걸린다(`core.masked` 참고).
  SPOP:
    types: [masked_float]
    range: {min: 0, max: 10000000}
  M00:
    types: [masked_float]
  M10:
    types: [masked_float]
  M15:
    types: [masked_float]
  M20:
    types: [masked_float]
  M25:
    types: [masked_float]
  M30:
    types: [masked_float]
  M35:
    types: [masked_float]
  M40:
    types: [masked_float]
  M45:
    types: [masked_float]
  M50:
    types: [masked_float]
  M55:
    types: [masked_float]
  M60:
    types: [masked_float]
  M65:
    types: [masked_float]
  M70:
    types: [masked_float]
  F00:
    types: [masked_float]
  F10:
    types: [masked_float]
  F15:
    types: [masked_float]
  F20:
    types: [masked_float]
  F25:
    types: [masked_float]
  F30:
    types: [masked_float]
  F35:
    types: [masked_float]
  F40:
    types: [masked_float]
  F45:
    types: [masked_float]
  F50:
    types: [masked_float]
  F55:
    types: [masked_float]
  F60:
    types: [masked_float]
  F65:
    types: [masked_float]
  F70:
    types: [masked_float]
