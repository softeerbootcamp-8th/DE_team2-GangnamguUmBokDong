source_id: weather_ultra_short_forecast
description: "기상청 초단기예보"
adapter: kma_apihub
adapter_params:
  endpoint: getUltraSrtFcst
  root_key: response.body.items.item
  pivot: {key: category, value: fcstValue}
  time_rule: half_hourly
  grids:
  - [57, 125]
  - [57, 126]
  - [57, 127]
  - [58, 124]
  - [58, 125]
  - [58, 126]
  - [58, 127]
  - [59, 124]
  - [59, 125]
  - [59, 126]
  - [59, 127]
  - [59, 128]
  - [59, 129]
  - [60, 124]
  - [60, 125]
  - [60, 126]
  - [60, 127]
  - [60, 128]
  - [60, 129]
  - [61, 124]
  - [61, 125]
  - [61, 126]
  - [61, 127]
  - [61, 128]
  - [61, 129]
  - [62, 124]
  - [62, 125]
  - [62, 126]
  - [62, 127]
  - [62, 128]
  - [62, 129]
  - [63, 125]
  - [63, 126]
  - [63, 127]
schedule: {interval: 30m}
storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]
quality: {max_drop_ratio: 0.05, max_missing_ratio: 0.15, allow_empty: false}
backfill: {enabled: true, max_age: 6h}
policies: {required_missing: drop_row, required_outlier: drop_row, optional_missing: keep_null,
  optional_outlier: set_null}
columns:
  nx:
    types: [int]
    required: true
  ny:
    types: [int]
    required: true
  baseDate:
    types: [str]
    required: true
  baseTime:
    types: [str]
    required: true
  fcstDate:
    types: [str]
    required: true
  fcstTime:
    types: [str]
    required: true
  T1H:
    types: [float]
    range: {min: -50, max: 50}
  # 같은 이름이지만 초단기 실황(weather_ultra_short_live)의 RN1과 달리 범주 표기다.
  # precip 캐스터가 mm 실수로 바꾼다(범위는 하한, 규칙은 `core.precip`).
  RN1:
    types: [precip]
  SKY:
    types: [int]
    enum: [1, 3, 4]
  PTY:
    types: [int]
    enum: [0, 1, 2, 3, 5, 6, 7]
  REH:
    types: [float]
    range: {min: 0, max: 100}
  WSD:
    types: [float]
    range: {min: 0, max: 50}
  LGT:
    types: [float]
    range: {min: 0, max: 100}
  POP:
    types: [float]
    range: {min: 0, max: 100}
  UUU:
    types: [float]
    range: {min: -50, max: 50}
  VVV:
    types: [float]
    range: {min: -50, max: 50}
  VEC:
    types: [float]
    range: {min: 0, max: 360}
