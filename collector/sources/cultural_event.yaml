source_id: cultural_event
description: 서울시 문화행사·공연행사

adapter: seoul_openapi
adapter_params:
  service: culturalEventInfo
  page_size: 1000
  root_key: culturalEventInfo.row

schedule:
  interval: 1d

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.0
  allow_empty: true # 행사가 없는 날도 있다

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  TITLE:
    types: [str]
    required: true
  CODENAME:
    types: [str]
  GUNAME:
    types: [str]
  PLACE:
    types: [str]
  STRTDATE:
    types: [str]
    required: true
  END_DATE:
    types: [str]
    required: true
  IS_FREE:
    types: [str]
  LOT:
    types: [float]
    range: { min: 126.5, max: 127.5 }
  LAT:
    types: [float]
    range: { min: 37.0, max: 38.0 }
