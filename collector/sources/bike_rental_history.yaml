source_id: bike_rental_history
description: 따릉이 대여이력 정보

adapter: seoul_openapi
adapter_params:
  service: tbCycleRentUseInfo
  page_size: 1000
  root_key: tbCycleRentUseInfo.row

schedule:
  interval: 5m

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.05
  allow_empty: false

backfill:
  enabled: true
  max_age: 7d

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  RENT_ID:
    types: [str]
    required: true
  RENT_DT:
    types: [str]
    required: true
  RENT_STATION_ID:
    types: [str]
    required: true
  RTN_DT:
    types: [str]
    required: true
  RTN_STATION_ID:
    types: [str]
    required: true
  USE_TIME:
    types: [int]
    range: { min: 0, max: 1440 }
  USE_DIST:
    types: [float]
    range: { min: 0, max: 200000 }
