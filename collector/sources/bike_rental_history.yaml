source_id: bike_rental_history
description: 따릉이 대여이력 정보

adapter: seoul_openapi
adapter_params:
  service: tbCycleRentUseDayInfo
  page_size: 1000
  root_key: cycleRentUseDayInfo.row
  path_suffix: "/{window_start:%Y-%m-%d}"

schedule:
  interval: 5m

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.05
  allow_empty: false

backfill:
  enabled: true
  max_age: 7d

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  RENT_DT:
    types: [str]
    required: true
  RENT_ID:
    types: [str]
    required: true
  RENT_NM:
    types: [str]
    required: true
  RENT_TYPE:
    types: [str]
  GENDER_CD:
    types: [str]
  AGE_TYPE:
    types: [str]
  USE_CNT:
    types: [int]
  EXER_AMT:
    types: [float]
  CARBON_AMT:
    types: [float]
  MOVE_METER:
    types: [float]
  MOVE_TIME:
    types: [int]
  START_INDEX:
    types: [int]
  END_INDEX:
    types: [int]
  RNUM:
    types: [str]
