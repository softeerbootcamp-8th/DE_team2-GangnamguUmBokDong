source_id: bike_rental_history
description: 따릉이 대여이력 정보

adapter: seoul_openapi
adapter_params:
  service: tbCycleRentData
  page_size: 1000
  root_key: rentData.row
  # 이 API는 `/{날짜}/{시}`를 받아 그 한 시간치를 준다(하루치가 아니다). 시 자리에
  # 날짜를 넣으면 유효한 시가 아니라 API가 00시로 폴백하므로, 하루 종일 00시대만
  # 반복 수집하게 된다.
  #
  # window_last(윈도우 직전 순간)를 쓰는 이유는 매시 끝자락 누락을 막기 위해서다.
  # window_start를 쓰면 19:00 윈도우가 19시대를 요청해 18:55~19:00 대여를 아무도
  # 가져가지 않는다.
  path_suffix: "/{window_last:%Y-%m-%d}/{window_last:%H}"

schedule:
  interval: 5m

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.05
  allow_empty: false

backfill:
  enabled: true
  max_age: 7d

compaction:
  # API가 시간 단위라 한 시간 안의 12개 윈도우가 같은 시간대를 누적으로 받아온다
  # (5분 증분을 보려면 이 누적이 필요하다). 그대로 이어붙이면 같은 대여 기록이
  # 최대 12번 들어가므로 archive를 만들 때 걷어낸다.
  dedup: true

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  BIKE_ID:
    types: [str]
    required: true
  RENT_DT:
    types: [str]
    required: true
  RENT_ID:
    types: [str]
  RENT_NM:
    types: [str]
  RENT_HOLD:
    types: [str]
  RTN_DT:
    types: [str]
  RTN_ID:
    types: [str]
  RTN_NM:
    types: [str]
  RTN_HOLD:
    types: [str]
  USE_MIN:
    types: [str, int]
  USE_DST:
    types: [str, float]
  USR_CLS_CD:
    types: [str]
  SEX_CD:
    types: [str]
  BIRTH_YEAR:
    types: [str, int]
  RENT_STATION_ID:
    types: [str]
  RETURN_STATION_ID:
    types: [str]
  BIKE_SE_CD:
    types: [str]
  START_INDEX:
    types: [int]
  END_INDEX:
    types: [int]
  RNUM:
    types: [str, int]
