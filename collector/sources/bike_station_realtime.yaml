source_id: bike_station_realtime
description: 따릉이 실시간 대여정보

adapter: seoul_openapi
adapter_params:
  service: bikeList
  page_size: 1000
  root_key: rentBikeStatus.row
  # bikeList의 list_total_count는 전체 건수가 아니라 현재 페이지 행 수다.
  # 응답 total을 무시하고 빈 페이지(INFO-200)까지 순차 탐색한다.
  pagination: probe
  # API 이상으로 빈 페이지가 영원히 오지 않아도 10,000행을 조용히 넘기지 않고
  # 명시적으로 실패한다. 현재 운영 대여소 약 2,736곳에는 충분한 여유다.
  max_probe_pages: 10

schedule:
  interval: 5m

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.0
  allow_empty: false

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  stationId:
    types: [str]
    required: true
  stationName:
    types: [str]
    required: true
  rackTotCnt:
    types: [int]
    range: { min: 0, max: 200 }
  parkingBikeTotCnt:
    types: [int]
    range: { min: 0, max: 200 }
    on_outlier: clip_to_range
  shared:
    types: [int]
    range: { min: 0, max: 1000 }
  stationLatitude:
    types: [float]
    range: { min: 37.4, max: 37.7 }
  stationLongitude:
    types: [float]
    range: { min: 126.7, max: 127.2 }
