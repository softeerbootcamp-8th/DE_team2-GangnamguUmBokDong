source_id: population_realtime
description: "\uC11C\uC6B8 \uC2E4\uC2DC\uAC04 \uC778\uAD6C \uB370\uC774\uD130"
adapter: seoul_openapi
adapter_params:
  service: citydata_ppltn
  page_size: 1000
  root_key: SeoulRtd.citydata_ppltn
  # 최상단 키 자체에 점이 들어가므로 경로 구분자로 해석하지 않는다.
  root_key_literal: true
  # FCST_PPLTN 중첩 배열을 Silver 검증용 FCST_n_* 스칼라 컬럼으로 펼친다.
  flatten_forecast: true
  poi_start: 1
  poi_end: 131
  # 공식 121개 장소 AREA_CD는 POI001~POI131 사이에 아래 10개 결번이 있다.
  poi_exclude: [22, 28, 57, 62, 65, 69, 75, 97, 99, 113]
  # 5분마다 POI 121개를 각각 호출하므로 병렬 조회한다.
  concurrency: 8
schedule: {interval: 5m}
storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]
quality: {max_drop_ratio: 0.05, max_missing_ratio: 0.15, allow_empty: false}
policies: {required_missing: drop_row, required_outlier: drop_row, optional_missing: keep_null,
  optional_outlier: set_null}
columns:
  AREA_NM:
    types: [str]
    required: true
  AREA_CD:
    types: [str]
    required: true
  AREA_CONGEST_LVL:
    types: [str]
    enum: ["\uC5EC\uC720", "\uBCF4\uD1B5", "\uC57D\uAC04 \uBD90\uBE54", "\uBD90\uBE54"]
  AREA_PPLTN_MIN:
    types: [int]
    range: {min: 0, max: 500000}
  AREA_PPLTN_MAX:
    types: [int]
    range: {min: 0, max: 500000}
  MALE_PPLTN_RATE:
    types: [float]
    range: {min: 0, max: 100}
  FEMALE_PPLTN_RATE:
    types: [float]
    range: {min: 0, max: 100}

  FCST_YN:
    types: [str]
  FCST_1_TIME:
    types: [str]
  FCST_1_CONGEST_LVL:
    types: [str]
    enum: ["\uC5EC\uC720", "\uBCF4\uD1B5", "\uC57D\uAC04 \uBD90\uBE54", "\uBD90\uBE54"]
  FCST_1_PPLTN_MIN:
    types: [int]
    range: {min: 0, max: 500000}
  FCST_1_PPLTN_MAX:
    types: [int]
    range: {min: 0, max: 500000}
  FCST_2_TIME:
