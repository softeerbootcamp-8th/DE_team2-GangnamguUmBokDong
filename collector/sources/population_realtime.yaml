# `FCST_*` 49개는 응답의 `FCST_PPLTN`(12개 중첩 배열)을 어댑터가 평탄화한 결과다
# (`adapters/seoul_openapi.py:_flatten_forecast`). 슬롯 번호는 `FCST_TIME` 오름차순
# 순서일 뿐 "n시간 후"가 아니다 — 어느 시각의 예측인지는 `FCST_n_TIME`이 말한다.
# 전부 optional로 둔다: 예측을 제공하지 않는 POI(`FCST_YN='N'`)가 `required_missing:
# drop_row`에 걸려 사라지면 그 지점의 현재 인구 보정까지 잃는다.
