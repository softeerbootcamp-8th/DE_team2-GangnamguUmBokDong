source_id: population_realtime
description: 서울 실시간 인구 데이터

adapter: seoul_openapi
adapter_params:
  service: citydata_ppltn
  page_size: 1000
  root_key: citydata_ppltn.row

schedule:
  interval: 5m

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.0
  allow_empty: false

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  AREA_NM:
    types: [str]
    required: true
  AREA_CD:
    types: [str]
    required: true
  AREA_CONGEST_LVL:
    types: [str]
    enum: ["여유", "보통", "약간 붐빔", "붐빔"]
  AREA_PPLTN_MIN:
    types: [int]
    range: { min: 0, max: 500000 }
  AREA_PPLTN_MAX:
    types: [int]
    range: { min: 0, max: 500000 }
  MALE_PPLTN_RATE:
    types: [float]
    range: { min: 0, max: 100 }
  FEMALE_PPLTN_RATE:
    types: [float]
    range: { min: 0, max: 100 }
