source_id: performance_event
description: 서울시 체육시설 공연행사 정보

adapter: seoul_openapi
adapter_params:
  service: stadiumScheduleInfo
  page_size: 1000
  root_key: stadiumScheduleInfo.row

schedule:
  interval: 1d

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.1
  max_missing_ratio: 0.1
  allow_empty: true

backfill:
  enabled: true
  max_age: 7d

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  SCH_SEQ:
    types: [str]
    required: true
  TITLE:
    types: [str]
    required: true
  SDATE:
    types: [str]
    required: true
  EDATE:
    types: [str]
    required: true
  USE_TIME:
    types: [str]
  USE_AGE:
    types: [str]
  USE_TARGET:
    types: [str]
  USE_PAY:
    types: [str]
  LINK_URL:
    types: [str]
  REG_DATE:
    types: [str]
  UPD_DATE:
    types: [str]
  SCH_CODE_A:
    types: [str]
  SCH_CODE_B:
    types: [str]
