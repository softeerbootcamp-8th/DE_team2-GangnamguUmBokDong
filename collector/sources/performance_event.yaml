source_id: performance_event
description: 서울시 체육시설 공연행사 정보

adapter: seoul_openapi
adapter_params:
  service: ListPublicReservationSport
  page_size: 1000
  root_key: ListPublicReservationSport.row

schedule:
  interval: 1d

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.1
  max_missing_ratio: 0.1
  allow_empty: true

backfill:
  enabled: true
  max_age: 7d

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  SVCID:
    types: [str]
    required: true
  SVCNM:
    types: [str]
    required: true
  MINCLASSNM:
    types: [str]
  AREANM:
    types: [str]
  PLACENM:
    types: [str]
  SVCOPNBGNDT:
    types: [str]
    required: true
  SVCOPNENDDT:
    types: [str]
    required: true
  PAYATNM:
    types: [str]
  X:
    types: [float]
    range: { min: 126.7, max: 127.2 }
  Y:
    types: [float]
    range: { min: 37.4, max: 37.7 }
