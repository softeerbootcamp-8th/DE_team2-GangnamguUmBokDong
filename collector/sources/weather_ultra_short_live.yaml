source_id: weather_ultra_short_live
description: "\uAE30\uC0C1\uCCAD \uCD08\uB2E8\uAE30 \uC2E4\uD669\xB7\uC608\uBCF4"
adapter: kma_apihub
adapter_params:
  endpoint: getUltraSrtNcst
  root_key: response.body.items.item
  pivot: {key: category, value: obsrValue}
  time_rule: hourly
  # fetch(base_time 파라미터)는 API가 허용하는 hourly 그리드를 쓰지만, freshness
  # 판단(Airflow의 --check-due-after-seconds)은 실제 갱신 주기(10분)에 맞춘
  # 전용 그리드를 쓴다 — adapters/kma_apihub.py 모듈 docstring 참고.
  freshness_rule: ten_minutely
  concurrency: 8
  grids:
  - [57, 125]
  - [57, 126]
  - [57, 127]
  - [58, 124]
  - [58, 125]
  - [58, 126]
  - [58, 127]
  - [59, 124]
  - [59, 125]
  - [59, 126]
  - [59, 127]
  - [59, 128]
  - [59, 129]
  - [60, 124]
  - [60, 125]
  - [60, 126]
  - [60, 127]
  - [60, 128]
  - [60, 129]
  - [61, 124]
  - [61, 125]
  - [61, 126]
  - [61, 127]
  - [61, 128]
  - [61, 129]
  - [62, 124]
  - [62, 125]
  - [62, 126]
  - [62, 127]
  - [62, 128]
  - [62, 129]
  - [63, 125]
  - [63, 126]
  - [63, 127]
schedule: {interval: 10m}
storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]
quality: {max_drop_ratio: 0.05, max_missing_ratio: 0.15, allow_empty: false}
policies: {required_missing: drop_row, required_outlier: drop_row, optional_missing: keep_null,
  optional_outlier: set_null}
columns:
  nx:
    types: [int]
    required: true
  ny:
    types: [int]
    required: true
  baseDate:
    types: [str]
    required: true
  baseTime:
    types: [str]
    required: true
  T1H:
    types: [float]
    range: {min: -50, max: 50}
  REH:
    types: [float]
    range: {min: 0, max: 100}
  WSD:
    types: [float]
    range: {min: 0, max: 50}
  # 같은 이름이지만 예보 계열(weather_ultra_short_forecast, weather_short_term_forecast)의
  # RN1/PCP와 달리 실황은 이미 숫자값으로 온다. precip 캐스터를 쓰지 않는다.
  RN1:
    types: [float]
    range: {min: 0, max: 500}
  PTY:
    types: [int]
    enum: [0, 1, 2, 3, 5, 6, 7]
  UUU:
    types: [float]
    range: {min: -50, max: 50}
  VVV:
    types: [float]
    range: {min: -50, max: 50}
  VEC:
    types: [float]
    range: {min: 0, max: 360}
