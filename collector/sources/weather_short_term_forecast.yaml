source_id: weather_short_term_forecast
description: "\uAE30\uC0C1\uCCAD \uB2E8\uAE30\uC608\uBCF4"
adapter: kma_apihub
adapter_params:
  endpoint: getVilageFcst
  root_key: response.body.items.item
  pivot: {key: category, value: fcstValue}
  time_rule: vilage_fcst
  # 격자당 페이지가 2장 필요해 순차로 돌면 34개 x 2페이지 = 68회, 약 51초가 걸린다
  # (실측 2026-08-23). 다른 두 날씨 소스보다 훨씬 무거워서 이 소스만 켠다.
  # 실측: 순차 50.89초 -> concurrency 4는 36.54초(30초 타임아웃에 여전히 못 들어감,
  # KMA 서버가 동시 연결을 어느 정도 제한하는 것으로 보임) -> concurrency 8은 14.45초.
  concurrency: 8
  grids:
  - [57, 125]
  - [57, 126]
  - [57, 127]
  - [58, 124]
  - [58, 125]
  - [58, 126]
  - [58, 127]
  - [59, 124]
  - [59, 125]
  - [59, 126]
  - [59, 127]
  - [59, 128]
  - [59, 129]
  - [60, 124]
  - [60, 125]
  - [60, 126]
  - [60, 127]
  - [60, 128]
  - [60, 129]
  - [61, 124]
  - [61, 125]
  - [61, 126]
  - [61, 127]
  - [61, 128]
  - [61, 129]
  - [62, 124]
  - [62, 125]
  - [62, 126]
  - [62, 127]
  - [62, 128]
  - [62, 129]
  - [63, 125]
  - [63, 126]
  - [63, 127]
schedule: {interval: 3h}
fetch: {retry_mode: retry_missing}
storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]
quality: {max_drop_ratio: 0.05, max_missing_ratio: 0.15, allow_empty: false}
policies: {required_missing: drop_row, required_outlier: drop_row, optional_missing: keep_null,
  optional_outlier: set_null}
columns:
  nx:
    types: [int]
    required: true
  ny:
    types: [int]
    required: true
  baseDate:
    types: [str]
    required: true
  baseTime:
    types: [str]
    required: true
  fcstDate:
    types: [str]
    required: true
  fcstTime:
    types: [str]
    required: true
  TMP:
    types: [float]
    range: {min: -50, max: 50}
  REH:
    types: [float]
    range: {min: 0, max: 100}
  WSD:
    types: [float]
    range: {min: 0, max: 50}
  POP:
    types: [float]
    range: {min: 0, max: 100}
  # 원본이 "강수없음"/"1.0mm 미만"/"30.0~50.0mm"/"2.0mm"/"0"이 섞인 범주 표기다.
  # precip 캐스터가 mm 실수로 바꾼다(범위는 하한, 규칙은 `core.precip`).
  PCP:
    types: [precip]
  SKY:
    types: [int]
    enum: [1, 3, 4]
  PTY:
    types: [int]
    enum: [0, 1, 2, 3, 4]
  UUU:
    types: [float]
    range: {min: -50, max: 50}
  VVV:
    types: [float]
    range: {min: -50, max: 50}
  VEC:
    types: [float]
    range: {min: 0, max: 360}
  WAV:
    types: [float]
    range: {min: 0, max: 20}
  # PCP와 같은 응답에 오는 적설 범주 표기("적설없음", "1.0~4.9cm", "5.0cm" 등).
  # 형태는 PCP와 같지만 단위가 cm라 precip이 아니라 snow 캐스터를 쓴다 — precip에
  # 넘기면 "5.0cm"가 캐스팅 실패로 null이 된다(`core.snow` 참고). 값의 단위는 cm다.
  SNO:
    types: [snow]
