source_id: weather_short_term_forecast
description: "\uAE30\uC0C1\uCCAD \uB2E8\uAE30\uC608\uBCF4"
adapter: kma_apihub
adapter_params:
  endpoint: getVilageFcst
  root_key: response.body.items.item
  pivot: {key: category, value: fcstValue}
  time_rule: vilage_fcst
  grids:
  - [57, 127]
  - [58, 124]
  - [58, 125]
  - [58, 126]
  - [58, 127]
  - [59, 124]
  - [59, 125]
  - [59, 126]
  - [59, 127]
  - [59, 128]
  - [60, 126]
  - [60, 127]
  - [60, 128]
  - [60, 129]
  - [61, 124]
  - [61, 125]
  - [61, 126]
  - [61, 127]
  - [61, 128]
  - [61, 129]
  - [62, 125]
  - [62, 126]
  - [62, 127]
  - [62, 129]
  - [63, 126]
schedule: {interval: 3h}
storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]
quality: {max_drop_ratio: 0.05, max_missing_ratio: 0.15, allow_empty: false}
backfill: {enabled: true, max_age: 24h}
policies: {required_missing: drop_row, required_outlier: drop_row, optional_missing: keep_null,
  optional_outlier: set_null}
columns:
  nx:
    types: [int]
    required: true
  ny:
    types: [int]
    required: true
  baseDate:
    types: [str]
    required: true
  baseTime:
    types: [str]
    required: true
  fcstDate:
    types: [str]
    required: true
  fcstTime:
    types: [str]
    required: true
  TMP:
    types: [float]
    range: {min: -50, max: 50}
  REH:
    types: [float]
    range: {min: 0, max: 100}
  WSD:
    types: [float]
    range: {min: 0, max: 50}
  POP:
    types: [float]
    range: {min: 0, max: 100}
  PCP:
    types: [str]
  SKY:
    types: [int]
    enum: [1, 3, 4]
  PTY:
    types: [int]
    enum: [0, 1, 2, 3, 4]
