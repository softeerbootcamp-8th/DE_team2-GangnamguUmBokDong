source_id: weather_short_term_forecast
description: 기상청 단기예보

adapter: kma_apihub
adapter_params:
  endpoint: getVilageFcst
  root_key: response.body.items.item
  pivot: { key: category, value: fcstValue }
  grids: [[60, 127], [61, 127], [61, 126]]

schedule:
  interval: 3h

storage:
  bronze_format: json
  silver_format: parquet
  partition: [dt, hh]

quality:
  max_drop_ratio: 0.05
  max_missing_ratio: 0.1
  allow_empty: false

backfill:
  enabled: true
  max_age: 24h

policies:
  required_missing: drop_row
  required_outlier: drop_row
  optional_missing: keep_null
  optional_outlier: set_null

columns:
  TMP:
    types: [float]
    range: { min: -50, max: 50 }
  REH:
    types: [float]
    range: { min: 0, max: 100 }
  WSD:
    types: [float]
    range: { min: 0, max: 50 }
  POP:
    types: [int]
    range: { min: 0, max: 100 }
  SKY:
    types: [int]
    enum: [1, 3, 4]
  PTY:
    types: [int]
    enum: [0, 1, 2, 3, 4]
