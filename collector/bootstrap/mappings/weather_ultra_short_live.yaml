# 기상청 ASOS 종합기상관측 시간자료 (weather_realtime_YYYY.csv)
#
# ## 이 입력이 운영 수집분과 다른 점 — 반드시 먼저 읽어야 한다
#
# 운영 수집(getUltraSrtNcst)은 **격자 34개 x 10분**이다. 이 CSV는 **관측 지점 1개 x
# 1시간**이다. 즉 같은 source_id로 적재하지만 공간·시간 밀도가 다르다.
#
# | | 운영 수집 | 이 CSV |
# | --- | --- | --- |
# | 공간 | 격자 34개 (대여소 최근접) | 지점 108 '서울'(종로구 송월동) 1개 |
# | 시간 | 10분 | 1시간 |
# | 컬럼 | T1H·REH·WSD·RN1·PTY·UUU·VVV·VEC | T1H·REH·WSD·RN1·VEC 직접 + UUU·VVV 파생 (PTY만 없음) |
#
# 그래서 격자 하나(60, 127)에만 적재한다. ASOS 108의 좌표(37.5714, 126.9658)를
# latlon_to_grid로 변환한 값이고, 운영 격자 34개에 실제로 포함된 격자다. 나머지 33개
# 격자에는 이 기간의 이력이 없다.
#
# 34개 격자에 같은 값을 복제하지 않는 이유: ml의 feature_engine이
# `_pick_first_per_hour(df, "_tick", [])`로 **시간당 한 행만** 고르고 격자를
# partition key로 쓰지 않는다(silver_source.py:183, "서울 전체 공통"). 복제해도 ml이
# 보는 값은 같고 archive만 23,000행 -> 782,000행으로 부풀며, 실제로 관측되지 않은
# 격자별 값이 들어간다.
#
# ## 공간 오차 (알고 쓰는 것이 중요하다)
#
# 대여소 2,746곳 기준 최근접 기상값까지의 거리:
#
# | 방식 | 평균 | 최대 |
# | --- | --- | --- |
# | 지점 108 하나 (이 CSV) | 9.75km | 19.20km |
# | 격자 34개 (운영 수집) | 2.00km | 3.58km |
#
# 격자 단위 조인이 필요한 소비자(apps/api의 weather_current)는 이 기간 데이터를
# 격자별 관측으로 신뢰할 수 없다. ml처럼 서울 전체를 한 점으로 축약하는 소비자에게는
# 임의 격자 대신 공식 관측소 값을 쓰는 것이라 근거가 더 명확하다.
#
# ## 형식
#
# cp949 + 한글 헤더 38컬럼. 실측 22,995행(2024-01-01 ~ 2026-08-18), 시각 간격이 정확히
# 60분이고 누락 구간이 없다. T1H·REH·VEC 빈값 0건, WSD 31건, 선언 range 위반 0건.

kind: csv
encoding: cp949

# `data/`에 따릉이 대여이력 CSV가 함께 있고, 그 파일명의 YYMM(2606)이 요청 범위와
# 겹치면 열려서 `일시` 컬럼이 없어 죽는다. 이 소스의 파일만 고른다.
# raw-data 배포본은 기상자료개방포털 원본 파일명(OBS_ASOS_TIM_<추출시각>.csv)
# 그대로다 — 파일명에 YYMM 조각이 없어 csv_source가 전체를 읽는다(경고 로그 남음).
file_pattern: "OBS_ASOS_TIM_*.csv"

# ASOS는 이 컬럼들의 빈값을 실제 결측으로 쓴다(WSD·VEC 각 31건). `\N` 같은 별도
# 표기는 없어서 na_values는 비운다.
na_values: []

column_map:
  "기온(°C)": T1H
  "습도(%)": REH
  "풍속(m/s)": WSD
  "강수량(mm)": RN1
  # 16방위를 도로 표현한 값이라 고유값이 17개(0, 20, 50, ... 340, 360)뿐이다.
  # 운영 수집의 VEC는 연속값('56', '135')이므로 이 기간만 해상도가 거칠다.
  "풍향(16방위)": VEC

# CSV에 없는 required 컬럼. 위 "이 입력이 운영 수집분과 다른 점" 참고.
constants:
  nx: "60"
  ny: "127"

# `일시`(2026-06-01 00:00) 하나를 baseDate + baseTime으로 나눈다. 운영 수집의
# baseDate/baseTime 형식(%Y%m%d / %H%M)과 같게 맞춘다.
derived_time:
  "일시":
    parse: "%Y-%m-%d %H:%M"
    into:
      baseDate: "%Y%m%d"
      baseTime: "%H%M"

# ASOS에는 UUU·VVV가 없고 풍속·풍향만 있다. 운영 수집은 두 성분을 이미 계산해서
# 주므로 같은 공식으로 채워 컬럼을 맞춘다 — 발명이 아니라 가진 값의 무손실 변환이다.
# 실황 API의 UUU/VVV와 격자 8곳에서 대조해 최대 오차 0.10/0.11 m/s를 확인했고, 그
# 오차는 API가 주는 WSD·VEC가 이미 소수 첫째 자리로 반올림된 값이라는 것만으로
# 설명된다(`core.wind` docstring, tests/test_wind.py 참고).
derived_wind:
  speed: WSD
  direction: VEC
  u: UUU
  v: VVV

value_map:
  # ASOS는 무강수 시각의 강수량을 빈 문자열로 둔다 — 결측이 아니라 0이다.
  # 실측 22,995행 중 20,352행(88.5%)이 빈값이고 강수 시각은 309행(1.3%)뿐이다.
  # 그대로 두면 검증 엔진이 결측으로 판정해 RN1이 대부분 null이 된다.
  RN1:
    "": "0"

# baseDate가 분해 결과이므로 날짜 버킷팅이 그것을 읽는다.
window:
  from_column: baseDate
  format: "%Y%m%d"

# 이 CSV는 연도별 파일 하나에 그 해 전체가 들어 있고 행이 중복되지 않는다.
dedup: false

# 채우지 못하는 컬럼: PTY(강수형태) 하나뿐이다. optional이라 null이 된다.
#
# `현상번호(국내식)`로 유도를 시도했으나 근거가 없었다. 22,995행 전체를 프로파일링한
# 결과 코드가 강수와 대응하지 않는다 — `01`이 강수 시각 1,277건과 무강수 시각 1,116건에
# 모두 나오고, 빈값 16,881행 중 452행은 적설이 있다(즉 빈값 != 현상 없음). 코드가 연결
# 표기(1901 = 19+01)라 공식 코드표와 시간 의미 없이는 추측이다. 강수량+기온+적설로
# 만드는 것은 기상청이 정의한 범주값을 발명하는 것이라 하지 않았다.
#
# 공간(격자 1개)과 시간(1시간)은 원본 그대로 둔다. 34격자 복제나 10분 forward-fill은
# 없는 데이터를 만드는 것이고, 실제로 ml에 정보를 하나도 더하지 못한다 —
# build_merged_table.py:191이 날씨를 `_hour_floor`만으로 조인하고(인구는 grid_id도
# 쓴다) 그 키가 시간 내림이라 시간 단위 값이 이미 모든 5분 tick에 붙는다.
# 정직한 공간 정합은 AWS(방재기상관측) 다지점 자료를 받는 것인데, API 허브의
# `stn_inf.php`·`awsh.php`가 활용신청 전이라(403) 이번에는 하지 못했다.
