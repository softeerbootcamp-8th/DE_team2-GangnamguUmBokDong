forecast_points:
  source_id: ml_predictions
  transform: forecast_points_from_predictions
  conflict_cols:
    - sta_id
    - predicted_dttm
  update_cols:
    - predicted_rent_cnt
    - predicted_return_cnt
    - batch_run_at
  reader: read_predictions
  expire_col: predicted_dttm

station_urgency:
  source_id: rebalance_urgency
  transform: station_urgency_from_urgency_batch
  conflict_cols:
    - sta_id
  update_cols:
    - urgency_score
    - minutes_until_critical
    - action_type
    - bike_qty
    - batch_run_at
  reader: read_urgency

rebalance_routes:
  source_id: rebalance_routes
  transform: rebalance_routes_from_routes_batch
  conflict_cols:
    - route_id
  update_cols: []
  reader: read_routes

rebalance_route_stops:
  source_id: rebalance_route_stops
  transform: rebalance_route_stops_from_route_stops_batch
  conflict_cols:
    - route_id
    - visit_order
  update_cols: []
  reader: read_route_stops
