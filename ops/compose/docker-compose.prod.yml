# AWS 운영 runtime의 단일 Compose 원본.
#
# AWS에서는 이 파일을 단독 실행한다. 로컬에서는 이 파일을 먼저 읽고
# docker-compose.yml adapter를 뒤에 합쳐 RDS→Postgres, S3→MinIO만 치환한다.
# Airflow/API/MLflow/web build·command는 양쪽 모두 이 파일의 정의를 그대로 쓴다.
#
# 로컬과 달라지는 점:
#   - postgres/postgres-schema-check  → RDS (외부)
#   - minio/minio-init                → 실제 S3 (instance profile 인증)
#   - host port와 local credential adapter를 사용하지 않음
#
# 실행:
#   docker compose --env-file /opt/app/.env -f ops/compose/docker-compose.prod.yml up -d --build
#
# `--env-file`이 반드시 필요하다. 아래 `${VAR:?}` 보간은 셸/--env-file에서만 읽히고
# 서비스의 `env_file:` 키에서는 읽히지 않는다(그건 컨테이너 런타임 주입 전용).

name: gng-ubd-prod

x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: ops/compose/Dockerfile.airflow
  env_file:
    - ${PROD_ENV_FILE:-/opt/app/.env}
  environment: &airflow-env
    AIRFLOW_HOME: /workspace/airflow
    PYTHONPATH: /workspace/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:?RDS airflow DB 연결 문자열이 필요합니다}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    # 로컬 compose에는 base64 리터럴이 하드코딩돼 있다. 운영은 반드시 주입받는다.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET이 필요합니다}
    AIRFLOW__API__BASE_URL: ${AIRFLOW_API_BASE_URL:-http://localhost:8080}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # 데이터와 모델이 준비되기 전에 파이프라인이 돌며 실패 로그만 쌓는 것을 막는다.
    # 준비가 끝나면 UI에서 station_master → weather_3h → weather_10min → realtime_5min 순으로 unpause.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # t4g.large(8GB)에서 BashOperator subprocess가 pandas/pyarrow(+LightGBM)를 들고
    # 뜬다 — 프로세스당 400MB~1.2GB다. LocalExecutor 기본 parallelism 32는 위험하다.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW__CORE__PARALLELISM:-3}
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG:-2}
    AIRFLOW_RESOURCE_PROBE_SAMPLE_SECONDS: ${AIRFLOW_RESOURCE_PROBE_SAMPLE_SECONDS:-1}
    # BashOperator subprocess(collector/normalizer/nowcaster/ml/loader)가 쓰는 값.
    DATABASE_URL: ${DATABASE_URL:?RDS app DB 연결 문자열이 필요합니다}
    # 빈 문자열이면 core.s3가 `or None`으로 처리해 실제 AWS S3로 간다.
    # AWS_ACCESS_KEY_ID/SECRET은 **절대 정의하지 않는다** — 정의하면 boto3가
    # EC2 instance profile을 조회하지 않아 S3 접근이 전부 403이 된다.
    S3_ENDPOINT_URL: ""
    # TZ는 설정하지 않는다. airflow/orchestration/templates.py가 KST(+09:00)를
    # 명시적으로 계산해 S3 키를 만들기 때문에, 컨테이너 TZ를 바꾸면 키 계약이 깨진다.
  volumes:
    - ../..:/workspace
    - airflow-module-venvs:/opt/venvs/modules
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # 1회성: airflow DB 마이그레이션 + 모듈 venv 6개 예열.
  # 첫 실행은 10~20분 걸린다 — 멈춘 게 아니다.
  airflow-init:
    <<: *airflow-common
    command: ["init"]
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: ["api-server"]
    restart: unless-stopped
    # 외부 노출은 보안 그룹(admin_cidrs)으로 통제한다. SSM 포트 포워딩으로도 접근 가능.
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command:
      - bash
      - -lc
      - cd /workspace/apps/api && env -u VIRTUAL_ENV uv run --frozen uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ${PROD_ENV_FILE:-/opt/app/.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?RDS app DB 연결 문자열이 필요합니다}
      S3_ENDPOINT_URL: ""
      # nginx가 같은 오리진으로 프록시하므로 CORS는 사실상 무의미하지만 방어선으로 좁힌다.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
    # 호스트에 포트를 열지 않는다 — web(nginx)이 compose 네트워크 안에서만 접근한다.
    restart: unless-stopped
    volumes:
      - ../..:/workspace
    healthcheck:
      # 이미지에 curl이 없다(python:3.11-slim + libgomp1). 파이썬으로 확인한다.
      # /healthz는 DB를 보지 않으므로 RDS 순단이 재시작 루프를 만들지 않는다.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz")
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    logging: *default-logging

  web:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.web
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "80:80"
    # 이미지 안에 굽지 않고 런타임에 마운트한다 — 계정을 바꿀 때 이미지를
    # 다시 빌드하지 않고 이 파일만 갱신 후 web 컨테이너만 재시작하면 된다.
    # make deploy-nginx-auth (Makefile 참고)로 생성한다.
    volumes:
      - ${PROD_NGINX_HTPASSWD:-/opt/app/ops/nginx/.htpasswd}:/etc/nginx/.htpasswd:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  mlflow:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.mlflow
    # MLFLOW_S3_ENDPOINT_URL과 AWS 자격증명을 주지 않는다 — instance profile을 쓴다.
    # 학습 EC2가 사설 IP로 이 서버에 붙으므로 0.0.0.0에 바인드하고 SG로 통제한다.
    #
    # --static-prefix: UI를 web(nginx)의 /mlflow/ 아래에 붙이기 위해 필요하다. 이게
    #   없으면 MLflow가 /static-files/... 같은 절대 경로를 뱉고, 그 요청은 nginx에서
    #   대시보드 SPA로 흘러가 흰 화면이 된다. 학습 EC2가 쓰는 API 경로도 같은 접두를
    #   갖게 되므로 MLFLOW_TRACKING_URI는 컨테이너 이름 그대로 http://mlflow:5000/mlflow 다.
    # --cors-allowed-origins: MLflow 3.15는 Host와 별개로 CORS Origin도 검사하며
    #   기본값이 localhost 계열뿐이다. nginx가 Host는 바꿔 보내지만 Origin은 브라우저가
    #   실제 주소로 붙이므로, 공개 주소로 UI를 쓸 때 ajax 호출이 막히면 .env에
    #   MLFLOW_CORS_ALLOWED_ORIGINS=http://<주소> 를 넣어 연다. 값이 없으면 옵션 자체를
    #   붙이지 않아 기본 동작(로컬만 허용)을 유지한다.
    command:
      - sh
      - -lc
      - >-
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}"
        --artifacts-destination "s3://$${S3_BUCKET}/mlflow-artifacts"
        --serve-artifacts
        --static-prefix /mlflow
        $${MLFLOW_CORS_ALLOWED_ORIGINS:+--cors-allowed-origins "$${MLFLOW_CORS_ALLOWED_ORIGINS}"}
    env_file:
      - ${PROD_ENV_FILE:-/opt/app/.env}
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?RDS mlflow DB 연결 문자열이 필요합니다}
      S3_BUCKET: ${S3_BUCKET:?}
    restart: unless-stopped
    ports:
      - "5000:5000"
    logging: *default-logging

volumes:
  airflow-module-venvs:
