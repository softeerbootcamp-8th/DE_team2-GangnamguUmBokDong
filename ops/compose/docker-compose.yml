name: de-team2-gangnamguumbokdong

services:
  postgres:
    image: postgis/postgis:16-3.5
    entrypoint: ["bash", "/usr/local/bin/gold-postgis-entrypoint.sh"]
    # Compose에서 entrypoint를 덮으면 이미지의 기본 CMD가 비워지므로 명시한다.
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-app}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
      POSTGRES_MLFLOW_DB: ${POSTGRES_MLFLOW_DB:-mlflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init/001_create_databases.sh:/docker-entrypoint-initdb.d/001_create_databases.sh:ro
      - ../postgres/init/002_gold_schema.sh:/docker-entrypoint-initdb.d/002_gold_schema.sh:ro
      - ../postgres/entrypoint.sh:/usr/local/bin/gold-postgis-entrypoint.sh:ro
      - ../../docs/gold/target-schema.sql:/opt/gold/target-schema.sql:ro
    healthcheck:
      # 공식 entrypoint의 init용 임시 서버는 Unix socket만 열기 때문에 TCP와
      # baseline 성공 marker를 함께 확인해야 전체 init 완료 전 green이 되지 않는다.
      test:
        - CMD-SHELL
        - >-
          test -f /var/lib/postgresql/data/.gold-postgis-target-schema-129 &&
          pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_APP_DB:-app}
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10

  # 기존 볼륨에는 DDL을 재적용하지 않는다. 새 볼륨의 원자적 baseline 적용 후에도
  # SSOT의 핵심 객체가 모두 있는지 읽기 전용으로 확인한 뒤 소비자를 시작한다.
  postgres-schema-check:
    image: postgis/postgis:16-3.5
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-app}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
    volumes:
      - ../postgres/check_gold_schema.sh:/opt/gold/check_gold_schema.sh:ro
      - ../postgres/check_gold_schema.sql:/opt/gold/check_gold_schema.sql:ro
    command: ["bash", "/opt/gold/check_gold_schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      # 운영환경에서는 학습 파이프라인이 S3에 직접 모델을 올린다 — 이 볼륨/미러링은
      # 로컬 개발 전용 1회성 부트스트랩이다 (models/*.txt,*.json은 참고용으로 레포
      # 루트에 있을 뿐, ml/inference는 S3에서만 모델을 로드하므로 로컬 MinIO에도
      # 똑같이 올려둬야 추론이 실제로 동작한다).
      - ../../models:/seed-models:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-local-dev};
      mc mirror --overwrite /seed-models local/${S3_BUCKET:-local-dev}/${MODELS_PREFIX:-models};
      exit 0;
      "

  mlflow:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # --serve-artifacts로 이 서버가 S3 업로드/다운로드를 대신 중계한다 — 그래서
    # feature_engine(EMR)/training(로컬)/inference(어디든) 클라이언트는 S3 자격증명
    # 없이 MLFLOW_TRACKING_URI 하나만으로 파라미터/지표/아티팩트를 전부 기록할 수 있다.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_MLFLOW_DB:-mlflow}
      --artifacts-destination s3://${S3_BUCKET:-local-dev}/mlflow-artifacts
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  airflow-init:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["init"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      # BashOperator subprocess(collector/normalizer/nowcasting/ml/loader)가 컨테이너
      # 내부에서 실제로 Postgres/MinIO에 붙도록, 호스트 관점 .env 값을 컨테이너 관점으로 덮어쓴다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../..:/workspace
      - airflow-module-venvs:/opt/venvs/modules
    depends_on:
      postgres-schema-check:
        condition: service_completed_successfully

  airflow-webserver:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["api-server"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - ../..:/workspace
      - airflow-module-venvs:/opt/venvs/modules
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["scheduler"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../..:/workspace
      - airflow-module-venvs:/opt/venvs/modules
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["dag-processor"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
    volumes:
      - ../..:/workspace
      - airflow-module-venvs:/opt/venvs/modules
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command:
      - bash
      - -lc
      - cd /workspace/apps/api && env -u VIRTUAL_ENV uv run --frozen uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../..:/workspace
    depends_on:
      postgres-schema-check:
        condition: service_completed_successfully

  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../..:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  airflow-module-venvs:
  web-node-modules:
