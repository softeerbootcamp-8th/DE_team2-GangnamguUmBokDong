name: de-team2-gangnamguumbokdong

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-app}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      # 운영환경에서는 학습 파이프라인이 S3에 직접 모델을 올린다 — 이 볼륨/미러링은
      # 로컬 개발 전용 1회성 부트스트랩이다 (models/*.txt,*.json은 참고용으로 레포
      # 루트에 있을 뿐, ml/inference는 S3에서만 모델을 로드하므로 로컬 MinIO에도
      # 똑같이 올려둬야 추론이 실제로 동작한다).
      - ../../models:/seed-models:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-local-dev};
      mc mirror --overwrite /seed-models local/${S3_BUCKET:-local-dev}/${MODELS_PREFIX:-models};
      exit 0;
      "

  airflow-init:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["init"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      # BashOperator subprocess(collector/normalizer/nowcasting/ml/loader)가 컨테이너
      # 내부에서 실제로 Postgres/MinIO에 붙도록, 호스트 관점 .env 값을 컨테이너 관점으로 덮어쓴다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["api-server"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["scheduler"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build:
      context: ../..
      dockerfile: ops/compose/Dockerfile.airflow
    command: ["dag-processor"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      AIRFLOW_HOME: /workspace/airflow
      PYTHONPATH: /workspace/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__API_AUTH__JWT_SECRET: "c29tZV9yYW5kb21fdmVyeV9sb25nX3NlY3JldF9rZXlfdGhhdF9tdXN0X2JlX2F0X2xlYXN0XzMyX2NoYXJz"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
