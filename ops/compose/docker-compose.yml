# 로컬 운영 재현용 adapter override.
#
# Airflow/API/MLflow/web 정의는 docker-compose.prod.yml을 단일 원본으로 사용한다.
# 이 파일은 AWS managed service만 로컬 대체재로 바꾸며 단독 실행하지 않는다.
#
#   docker compose --env-file .env \
#     -f ops/compose/docker-compose.prod.yml \
#     -f ops/compose/docker-compose.yml up -d --build

name: umbokdong-dashboard-live

services:
  # RDS PostgreSQL 16 + PostGIS 3.4를 같은 버전의 로컬 컨테이너로 치환한다.
  postgres:
    image: postgis/postgis:16-3.4
    entrypoint: ["bash", "/usr/local/bin/gold-postgis-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-app}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
      POSTGRES_MLFLOW_DB: ${POSTGRES_MLFLOW_DB:-mlflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init/001_create_databases.sh:/docker-entrypoint-initdb.d/001_create_databases.sh:ro
      - ../postgres/init/002_gold_schema.sh:/docker-entrypoint-initdb.d/002_gold_schema.sh:ro
      - ../postgres/entrypoint.sh:/usr/local/bin/gold-postgis-entrypoint.sh:ro
      - ../../docs/gold/target-schema.sql:/opt/gold/target-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /var/lib/postgresql/data/.gold-postgis-target-schema-129 &&
          pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_APP_DB:-app}
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10

  postgres-schema-check:
    image: postgis/postgis:16-3.4
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-app}
      POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB:-airflow}
    volumes:
      - ../postgres/check_gold_schema.sh:/opt/gold/check_gold_schema.sh:ro
      - ../postgres/check_gold_schema.sql:/opt/gold/check_gold_schema.sql:ro
    command: ["bash", "/opt/gold/check_gold_schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # AWS S3를 S3-compatible MinIO로 치환한다.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      - ../../models:/seed-models:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-local-dev};
      mc mirror --overwrite /seed-models local/${S3_BUCKET:-local-dev}/${MODELS_PREFIX:-models};
      exit 0;
      "

  airflow-init:
    env_file: !override &local-runtime-env
      - path: ../../.env
        required: false
    environment: &local-airflow-adapter
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_AIRFLOW_DB:-airflow}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      GOLD_STATION_MASTER_LOOKBACK_HOURS: ${GOLD_STATION_MASTER_LOOKBACK_HOURS:-168}
      GOLD_STATION_REALTIME_LOOKBACK_HOURS: ${GOLD_STATION_REALTIME_LOOKBACK_HOURS:-24}
    depends_on:
      postgres-schema-check:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  airflow-webserver:
    env_file: *local-runtime-env
    environment: *local-airflow-adapter
    ports: !override
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"

  airflow-scheduler:
    env_file: *local-runtime-env
    environment: *local-airflow-adapter

  airflow-dag-processor:
    env_file: *local-runtime-env
    environment: *local-airflow-adapter

  api:
    env_file: *local-runtime-env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_APP_DB:-app}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres-schema-check:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  mlflow:
    env_file: *local-runtime-env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_MLFLOW_DB:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-local-dev}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: !override
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres-schema-check:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # 운영과 같은 정적 build + nginx + same-origin /api proxy를 사용한다.
  web:
    ports: !override
      - "${WEB_PORT:-5173}:80"
    volumes: !override
      - ../../ops/nginx/.htpasswd:/etc/nginx/.htpasswd:ro

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME_NAME:-umbokdong-dashboard-live_postgres-data}
  minio-data:
