# 운영 web 컨테이너의 nginx 설정.
#
# API를 같은 오리진(/api/)으로 프록시해서 브라우저가 크로스 오리진 요청을 아예 하지
# 않게 한다 — CORS preflight와 mixed content 문제가 함께 사라지고, apps/web/src/api.ts를
# 수정할 필요도 없다(VITE_API_BASE=/api로 빌드). API 컨테이너의 8000번은 호스트에
# 노출하지 않고 compose 네트워크 안에서만 접근한다.

# 로그인 계정·IP를 접근 로그에 남긴다. Basic Auth는 로그인이라는 별도 이벤트가
# 없고 매 요청마다 자격증명을 다시 실어 보내므로, 요청마다 $remote_user(인증
# 성공 시 nginx가 채운다)와 $remote_addr을 같이 남기는 게 "로그인 로그"에 가장 가깝다.
log_format with_auth '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout with_auth;

    # 대시보드 전체(정적 자산 + /api/ 프록시)를 잠근다. 회원가입은 없고 계정은
    # .htpasswd에 미리 심어둔다 — 늘리려면 ops/nginx/README.md 참고.
    # 운영 이미지는 Basic Auth snippet을 포함한다. 로컬 compose는 같은 경로에
    # 빈 snippet을 mount해 인증만 끄고 나머지 proxy/cache 설정은 공유한다.
    include /etc/nginx/snippets/dashboard-auth.conf;

    root /usr/share/nginx/html;
    index index.html;

    # 번들 파일명에 해시가 붙으므로(vite 기본) 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 반대로 캐시하면 안 된다 — 낡은 index가 사라진 해시 번들을
    # 가리키면 배포 직후 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # proxy_pass 끝의 슬래시가 핵심이다. /api/stations 요청이 api:8000/stations로
    # 전달되며 /api 접두가 제거된다. 슬래시를 빼면 /api/stations 그대로 넘어가 404가 난다.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대시보드가 15초/30초/60초 주기로 폴링한다. 파이프라인이 밀려 응답이
        # 느려질 때 502로 끊기보다 조금 기다리는 편이 화면에 낫다.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # MLflow UI. 5000번을 인터넷에 여는 대신 이 nginx의 Basic Auth 뒤에 둔다
    # (server 블록의 auth_basic이 이 location에도 그대로 상속된다). SG의 5000번
    # 규칙은 학습 EC2 통신과 SSH 터널용으로 남는다.
    #
    # Host를 localhost:5000으로 바꿔 보내는 게 핵심이다. MLflow 3.15는 Host 헤더를
    # 검증해서(fastapi_security) 공인 IP로 온 요청을 403으로 막는데, 검증 자체를
    # 끄는 대신 기본 허용값인 localhost로 재작성해 "nginx를 거친 요청만" 통과시킨다.
    #
    # proxy_pass 뒤에 경로를 붙이지 않는 것도 의도된 것이다 — /api/와 반대로 여기서는
    # /mlflow 접두를 **떼면 안 된다**. mlflow가 --static-prefix /mlflow로 떠서 그 접두를
    # 포함한 경로로 서비스하기 때문이다.
    location /mlflow/ {
        proxy_pass http://mlflow:5000;
        proxy_set_header Host localhost:5000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 아티팩트(모델 파일) 업로드·다운로드가 --serve-artifacts로 이 경로를 지난다.
        # 기본 1m 제한이면 모델 업로드가 413으로 잘리고, 30초 제한이면 큰 파일이 끊긴다.
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 주소창에 /mlflow만 친 경우. 이게 없으면 아래 SPA fallback에 걸려 대시보드가 뜬다.
    location = /mlflow {
        return 301 /mlflow/;
    }

    # 지금은 라우터가 없는 단일 화면 SPA라 fallback이 사실상 필요 없지만,
    # 향후 react-router 도입 대비로 둔다. 무해하다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
