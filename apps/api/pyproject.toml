[project]
name = "api"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "core",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
core = { path = "../../libs/core", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
