[project]
name = "training"
version = "0.1.0"
description = "feature 테이블로 LightGBM 대여/반납 모델 학습, 성능 모니터링"
requires-python = ">=3.11"
dependencies = [
    "lightgbm",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "ml_core",
]

[dependency-groups]
dev = ["pytest", "moto[s3]>=5.2.2"]

[tool.uv]
package = false

[tool.uv.sources]
ml_core = { path = "../../libs/ml_core", editable = true }
