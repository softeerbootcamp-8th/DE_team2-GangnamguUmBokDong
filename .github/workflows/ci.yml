name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: make sync-ci-unit

      - name: Test
        run: make test-ci-unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Create CI env file
        run: cp .env.example .env

      - name: Start test infrastructure
        run: make up

      - name: Fix permissions from Docker root
        run: sudo chown -R $USER:$USER .

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/app
        run: make test-ci-integration

      - name: Stop test infrastructure
        if: always()
        run: make down

  quality:
    name: Lint and Test
    if: always()
    needs:
      - unit-tests
      - integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Verify required checks
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        run: |
          test "$UNIT_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
