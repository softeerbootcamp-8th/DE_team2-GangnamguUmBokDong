name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: make sync-ci-unit

      - name: Test
        run: make test-ci-unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Create CI env file
        run: cp .env.example .env

      - name: Start test infrastructure
        run: make up

      - name: Fix permissions from Docker root
        run: sudo chown -R $USER:$USER .

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/app
        run: make test-ci-integration

      - name: Stop test infrastructure
        if: always()
        run: make down

  arm64-compatibility:
    name: Arm64 Compatibility
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Verify native architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Sync Graviton runtime dependencies
        run: |
          for project in \
            airflow collector poi_master apps/api ml/inference ml/training ml/feature_engine \
            libs/core libs/ml_core normalizer nowcaster loader rebalance; do
            echo "==> ${project}"
            (cd "${project}" && uv sync --frozen)
          done

      - name: Test Arm model runtime paths
        run: |
          (cd airflow && uv run pytest -q)
          (cd collector && uv run pytest -q)
          (cd poi_master && uv run pytest -q)
          (cd ml/inference && uv run pytest -q)
          (cd ml/training && uv run pytest -q)
          (cd libs/ml_core && uv run pytest -q)

      - name: Build Arm service images
        run: |
          docker build --platform linux/arm64 \
            -f ops/compose/Dockerfile.airflow \
            -t de-team2-airflow:arm64 .
          docker build --platform linux/arm64 \
            -f ops/compose/Dockerfile.mlflow \
            -t de-team2-mlflow:arm64 .

  quality:
    name: Lint and Test
    if: always()
    needs:
      - unit-tests
      - integration-tests
      - arm64-compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Verify required checks
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          ARM64_RESULT: ${{ needs.arm64-compatibility.result }}
        run: |
          test "$UNIT_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$ARM64_RESULT" = "success"
