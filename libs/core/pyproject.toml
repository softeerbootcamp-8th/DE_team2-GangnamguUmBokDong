[project]
name = "core"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "boto3>=1.34.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
