[project]
name = "nowcaster"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "boto3>=1.43.69",
    "pyarrow>=25.0.1",
    "holidays>=0.65",
    "pandas>=2.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "moto[s3]>=5.2.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
