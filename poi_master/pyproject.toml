[project]
name = "poi-master"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "core",
    "boto3==1.43.69",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "shapely>=2.1.2",
]

[tool.uv]
package = false

[tool.uv.sources]
core = { path = "../libs/core", editable = true }

[dependency-groups]
dev = [
    "moto[s3]>=5.2.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
